# Scratch workflow, not for merge. It answers one question for finos/architecture-as-code#3871:
# does the ~/.m2 that the integration build fills hold all that the other calm-hub JVM builds need?
# Each consumer job is a new runner with a new checkout, and runs Maven offline (-o), so a missing
# artifact fails the build.
name: Scratch - Maven cache superset check

permissions:
    contents: read

on:
    push:
        branches:
            - 'scratch/m2-superset-check'

jobs:
    baseline:
        name: Integration build from an empty ~/.m2 (build-calm-hub.yml)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Docker
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Start from an empty local repository
              run: |
                  mvn -v
                  rm -rf ~/.m2/repository ~/.m2/wrapper

            - name: Build and Test
              working-directory: calm-hub
              run: mvn -P integration clean verify

            - name: Pack ~/.m2
              run: |
                  echo "SUPERSET-BASELINE $(find ~/.m2 -type f | wc -l) files, $(du -sh ~/.m2 | cut -f1), wrapper present: $([ -d ~/.m2/wrapper ] && echo yes || echo no)"
                  tar -C ~ -cf "$RUNNER_TEMP/m2.tar" .m2

            - name: Upload ~/.m2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: m2-baseline
                  path: ${{ runner.temp }}/m2.tar
                  retention-days: 1

    consumer:
        name: Offline ${{ matrix.build }}
        needs: baseline
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - build: coverage (build-calm-hub-coverage.yml)
                      command: mvn -o clean verify
                    - build: image (docker-publish-calm-hub.yml)
                      command: mvn -o -P integration clean package
                    - build: read-only image (docker-publish-calm-hub-readonly.yml)
                      command: mvn -o package -DskipITs && bash build-readonly-image.sh --no-maven --no-docker

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Download ~/.m2
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: m2-baseline
                  path: ${{ runner.temp }}

            - name: Restore ~/.m2 as the cache step does
              run: |
                  rm -rf ~/.m2
                  tar -C ~ -xf "$RUNNER_TEMP/m2.tar"
                  (cd ~/.m2 && find . -type f | sort) > "$RUNNER_TEMP/before.txt"
                  mvn -v

            - name: Build offline
              working-directory: calm-hub
              env:
                  COMMAND: ${{ matrix.command }}
              run: |
                  echo "SUPERSET-COMMAND $COMMAND"
                  bash -c "set -euo pipefail; $COMMAND"

            - name: Report
              if: ${{ !cancelled() }}
              run: |
                  (cd ~/.m2 && find . -type f | sort) > "$RUNNER_TEMP/after.txt"
                  comm -13 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" > "$RUNNER_TEMP/new.txt"
                  echo "SUPERSET-RESULT $(wc -l < "$RUNNER_TEMP/new.txt") new files, $(grep -cE '\.(jar|pom|zip)$' "$RUNNER_TEMP/new.txt" || true) of them jar/pom/zip"
                  head -200 "$RUNNER_TEMP/new.txt"
